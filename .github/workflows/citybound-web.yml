name: CITYBOUND verified web preview
on:
  push:
    branches: [citybound-web-20261101]
    paths:
      - 'experiments/citybound-web-20261101/**'
      - '.github/workflows/citybound-web.yml'
permissions:
  contents: read
concurrency:
  group: citybound-web-preview
  cancel-in-progress: true
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.56.0 cryptography
          python -m playwright install --with-deps chromium
      - name: Bundle assets and verify playable game
        run: python experiments/citybound-web-20261101/prepare_and_test.py
      - name: Publish verified site and test public HTTPS URL
        run: python experiments/citybound-web-20261101/publish_verified.py
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citybound-web-evidence
          path: citybound-evidence/
          retention-days: 14
      - name: Save portable build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citybound-web-build
          path: |
            experiments/citybound-web-20261101/index.html
            experiments/citybound-web-20261101/vendor/
            experiments/citybound-web-20261101/assets/
            experiments/citybound-web-20261101/licenses/
            experiments/citybound-web-20261101/THIRD_PARTY_NOTICES.txt
            experiments/citybound-web-20261101/ASSET_MANIFEST.json
            experiments/citybound-web-20261101/robots.txt
          retention-days: 30
